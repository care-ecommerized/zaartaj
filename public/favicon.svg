<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 88" role="img" aria-label="Zaartaj Elegance">
    <defs>
        <linearGradient id="zt-gown" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#12766e" />
            <stop offset="100%" stop-color="#7fc5bc" />
        </linearGradient>
    </defs>

    <!-- crown -->
    <path d="M23 15 L25.5 9 L28 13 L30 7 L32 13 L34.5 9 L37 15 Z" fill="#c9a94f" />
    <rect x="23" y="15.5" width="14" height="2.4" rx="1.2" fill="#c9a94f" />

