    <path d="M30 23.5 v3" stroke="#c9a94f" stroke-width="1.6" />
    <path d="M24 30 q6 -4 12 0 l1.5 10 q-7.5 3 -15 0 Z" fill="url(#zt-gown)" />

    <!-- skirt sweeping to the right -->
